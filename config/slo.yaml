service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    Mục tiêu là 99.5% request thành công trong tối đa 3000 ms,
    đánh giá trên cửa sổ 28 ngày. Baseline lab gồm 10 request
    có P95 705.2 ms và TTFT P95 50 ms.
    Giữ ngưỡng 3000 ms để có khoảng dự phòng so với baseline.
    Mẫu lab nhỏ chưa đủ chứng minh đạt SLO trong 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
